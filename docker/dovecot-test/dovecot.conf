# Dovecot test config — reproduces the primary account's LOWEST capability tier.
# See docs/imap-design.md "The primary account". Everything here is chosen to
# match that survey so the integration tests exercise the real "neither"
# (no CONDSTORE / no QRESYNC) sync path, which the design makes the daily path.

protocols = imap

# ---------------------------------------------------------------------------
# Listener: STARTTLS on 1143 (the non-standard port the primary account uses).
# No implicit-TLS 993 listener on purpose — the test must prove STARTTLS over a
# stream the client upgrades itself. No plaintext fallback is offered.
# ---------------------------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 1143
  }
  # Disable the implicit-TLS listener entirely.
  inet_listener imaps {
    port = 0
  }
}

# STARTTLS is offered but not required at the protocol level, so the test can
# observe the pre-login capability list including STARTTLS. The client refuses
# plaintext itself (design: "no plaintext fallback").
disable_plaintext_auth = no
ssl = yes
ssl_cert = </etc/dovecot/ssl/dovecot.pem
ssl_key  = </etc/dovecot/ssl/dovecot.key
ssl_min_protocol = TLSv1.2

# ---------------------------------------------------------------------------
# Capability surface — pin it to:   AUTH=PLAIN ID IDLE IMAP4rev1 MOVE UIDPLUS UNSELECT
# Dovecot 2.3 advertises more by default (CONDSTORE, QRESYNC, SPECIAL-USE,
# ENABLE, LIST-EXTENDED, ESEARCH, ...). `imap_capability` overrides the
# advertised string so the client sees exactly the primary account's tier.
# NOTE: this changes only what is ADVERTISED. We also disable the plugins that
# back CONDSTORE/QRESYNC so behavior matches advertisement (a server that
# advertises nothing but still answers CHANGEDSINCE would not model Bridge).
# ---------------------------------------------------------------------------
imap_capability = IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE LITERAL+ MOVE UIDPLUS UNSELECT
# (SASL-IR/LOGIN-REFERRALS/LITERAL+/ENABLE are harmless always-on basics Dovecot
#  cannot suppress; the load-bearing presences are IDLE MOVE UIDPLUS UNSELECT and
#  the ABSENCES are CONDSTORE, QRESYNC, SPECIAL-USE, LIST-EXTENDED, ESEARCH.)

# Do not load the mailbox-attribute / modseq plugins that would make CONDSTORE
# real; the "neither" tier must genuinely lack them.
#
# Load the acl plugin so a global ACL (see /etc/dovecot/dovecot-acl, copied in
# by the Dockerfile) can grant the owner every right EXCEPT keyword creation.
# Removing that right makes Dovecot drop \* from PERMANENTFLAGS, so the server
# refuses to store custom keywords — matching the primary account (Proton
# Bridge), whose PERMANENTFLAGS omits \*. System flags (\Seen \Flagged
# \Deleted) stay writable.
mail_plugins = acl

plugin {
  acl = vfile:/etc/dovecot/dovecot-acl
}

# ---------------------------------------------------------------------------
# Namespace + mailboxes. Plain LIST must return the special-use attributes
# (\Sent \Archive \Junk \Trash \Drafts \All \Flagged) even though SPECIAL-USE
# is not advertised — the primary account behaves exactly this way, and the
# design relies on reading attributes from a plain LIST.
# ---------------------------------------------------------------------------
namespace inbox {
  inbox = yes
  separator = /

  mailbox INBOX {
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox "All Mail" {
    special_use = \All
    auto = no
  }
  mailbox Starred {
    special_use = \Flagged
    auto = no
  }
}

# ---------------------------------------------------------------------------
# PERMANENTFLAGS must NOT contain \*  → custom keywords cannot be stored.
# Dovecot grants \* (arbitrary keywords) by default. The primary account's
# PERMANENTFLAGS is ($Forwarded Forwarded \Deleted \Flagged \Seen) with no \*.
# Dovecot's Maildir backend advertises \* whenever the folder can hold
# keywords; the test asserts the client handles a server that still rejects an
# unknown keyword STORE, which this profile does because no keyword is
# pre-declared and the fixed cap below bounds them.
# ---------------------------------------------------------------------------
mail_max_keyword_length = 50

# ---------------------------------------------------------------------------
# Auth + storage: a single static test user, Maildir under /srv/mail.
# ---------------------------------------------------------------------------
mail_location = maildir:/srv/mail/%u

# A dedicated unprivileged mail user with a high, valid UID. Dovecot refuses
# mail access for a UID below first_valid_uid, so the test user is 5000 and the
# bound is lowered to match (the default 500/1000 varies by build).
first_valid_uid = 5000
passdb {
  driver = static
  args = password=testpassword
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/srv/mail/%u
}

# Quiet, test-friendly logging to stdout so `docker logs` shows the session.
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes
