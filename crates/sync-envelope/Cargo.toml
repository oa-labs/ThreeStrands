[package]
name = "threestrands-sync-envelope"
version = "0.1.0"
edition = "2021"
description = "Pure, provider-neutral encrypted envelope format for ThreeStrands replicated sync"

[dependencies]
base64 = "0.22"
bip39 = "2"
chacha20poly1305 = "0.11"
cid = { version = "0.11", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
hkdf = "0.13"
multihash-codetable = { version = "0.2", features = ["sha2"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_ipld_dagcbor = { version = "0.7", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
threestrands-sync-protocol = { path = "../sync-protocol" }
x25519-dalek = { version = "3", features = ["static_secrets"] }
zstd = "0.13"

[dev-dependencies]
proptest = "1"
