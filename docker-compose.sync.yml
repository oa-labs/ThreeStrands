services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: threestrands
      POSTGRES_USER: threestrands
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threestrands"]
      interval: 2s
      timeout: 2s
      retries: 20
  sync-server:
    build:
      context: .
      dockerfile: services/sync-server/Dockerfile
    environment:
      DATABASE_URL: postgres://threestrands:local-development-only@postgres/threestrands
      PUBLIC_BASE_URL: http://localhost:8080
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-development-client}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-development-secret}
      RUST_LOG: threestrands_sync_server=info,tower_http=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
