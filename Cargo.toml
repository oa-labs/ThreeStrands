[workspace]
resolver = "2"
members = [
    "crates/sync-protocol",
    "crates/sync-envelope",
    "crates/sync-core",
    "crates/sync-transport",
]

# `src-tauri` is deliberately kept OUT of this workspace (see the
# pluggable-replicated-sync plan, Phase 1): it ships its own `Cargo.lock`, and
# AGENTS.md pins the shipped "threestrands" package version to that exact
# file. Folding it into this workspace would move that lock entry to a root
# `Cargo.lock` instead.
exclude = ["src-tauri"]
