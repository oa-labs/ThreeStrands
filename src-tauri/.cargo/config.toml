[target.'cfg(target_os = "macos")']
runner = "scripts/codesign-dev-runner.sh"

# Build settings for whisper.cpp, which whisper-rs-sys compiles with CMake and
# hands every GGML_* and CMAKE_* variable. The repository root's
# .cargo/config.toml repeats them for cargo commands run from there.
[env]
# GGML_NATIVE defaults to ON, which compiles for the build machine's own CPU
# (-mcpu=native, -march=native) and can crash on other CPUs of the same
# architecture. OFF builds for the architecture's baseline, so one build runs
# on every Mac it targets.
GGML_NATIVE = "OFF"
# whisper.cpp uses std::filesystem, which macOS has from 10.15, the app's
# minimum (`bundle.macOS.minimumSystemVersion` in tauri.conf.json). Release
# builds pass that minimum to CMake as MACOSX_DEPLOYMENT_TARGET; cargo builds
# outside Tauri (tests, an x86_64 build, whose default target is older) don't,
# so this sets it for them. Keep it equal to the app's minimum.
CMAKE_OSX_DEPLOYMENT_TARGET = "10.15"
