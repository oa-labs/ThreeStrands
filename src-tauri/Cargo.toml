[package]
name = "threestrands"
version = "0.86.12"
description = "A local-first, keyboard-driven email client"
authors = ["OpenArc LLC"]
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "threestrands_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = "0.6"
async-trait = "0.1"
base64 = "0.22"
calcard = { version = "0.3.13", default-features = false }
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cid = { version = "0.11", default-features = false, features = ["std"] }
fontdb = "0.24"
imagesize = "0.15"
gethostname = "1.1"
iroh-car = "0.5"
jiff = "0.2"
# The default `v1` feature keeps keyring 3's entry naming (macOS login
# keychain service/account, Windows `{user}.{service}` targets, Secret
# Service service/username attributes), so stored OAuth tokens and keys
# written by earlier releases still load. Re-check that on any upgrade.
keyring = "4.2"
log = "0.4"
mail-builder = "1.0"
mail-parser = "0.11"
md-5 = "0.11"
# Token requests go through the app's own `reqwest` client (see
# `auth::send_oauth_request`), so oauth2's bundled reqwest adapter is off.
oauth2 = { version = "5", default-features = false }
open = "5"
percent-encoding = "2.3.2"
# Text extraction for attachments the user shares with Thread Chat.
pdf-extract = "0.12"
quick-xml = "0.42"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls-no-provider"] }
# reqwest's `rustls-no-provider` leaves the TLS crypto backend to the app:
# `http_client::builder` installs ring, matching tauri-plugin-updater.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
# Sans-IO SigV4 presigning and ListObjectsV2 parsing for the S3 sync
# connector; requests go over the app's own `reqwest` client.
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "net", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", default-features = false }
unicode-general-category = "1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.13"
threestrands-sync-core = { path = "../crates/sync-core" }
threestrands-sync-envelope = { path = "../crates/sync-envelope" }
threestrands-sync-protocol = { path = "../crates/sync-protocol" }
threestrands-sync-transport = { path = "../crates/sync-transport" }
tauri-plugin-updater = "2"
csv = "1"

[target.'cfg(unix)'.dependencies]
xattr = "1"

# Default-app registration (Settings → Default Apps) through NSWorkspace.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "block2", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[dev-dependencies]
# Test-only: backs the fake Kubo-compatible RPC server the IPFS RPC
# transport's conformance and security tests run against, so the real
# `reqwest`-based client code is exercised over real HTTP rather than
# mocked at the function-call level.
axum = { version = "0.8", features = ["multipart"] }
# Test-only: paused tokio time for the polling loop's wait tests.
tokio = { version = "1", features = ["test-util"] }
