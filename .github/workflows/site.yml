name: Marketing site

on:
  pull_request:
    paths:
      - "site/**"
      - "tests/site/**"
      - "playwright.site.config.ts"
      - ".github/workflows/site.yml"
  push:
    branches:
      - master
    paths:
      - "site/**"
      - "tests/site/**"
      - "playwright.site.config.ts"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # configure-pages reads the Pages site to resolve its canonical URL.
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Pull requests can build before Pages is enabled.
      - name: Resolve the Pages URL
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # Relative assets support both the custom domain and repository URL.
      # test:site tests the same production output at both hosting paths.
      - name: Build and test the site
        run: pnpm test:site
        env:
          CI: "1"
          SITE_BASE: "./"
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
