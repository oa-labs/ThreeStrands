name: Linux build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Require and embed the configured Google OAuth client and sign the AppImage update
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-amd64:
    name: Linux x86-64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The hosted image's preinstalled SDKs leave too little disk for the
      # devcontainer image, Cargo target, and AppImage staging.
      - name: Free runner disk space
        run: ./scripts/free-ci-disk.sh

      # devcontainers/ci exports an OCI archive when platform is specified.
      # The runner's default docker driver does not support this exporter.
      - name: Set up Docker Buildx for OCI export
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true

      - name: Build and verify packages in the devcontainer
        uses: devcontainers/ci@v0.3
        env:
          THREESTRANDS_GOOGLE_CLIENT_ID: ${{ inputs.release == true && secrets.THREESTRANDS_GOOGLE_CLIENT_ID || '' }}
          THREESTRANDS_GOOGLE_CLIENT_SECRET: ${{ inputs.release == true && secrets.THREESTRANDS_GOOGLE_CLIENT_SECRET || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release == true && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release == true && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          THREESTRANDS_RELEASE_BUILD: ${{ inputs.release == true && '1' || '0' }}
          # Avoid full debug symbols and incremental caches on ephemeral runners.
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        with:
          platform: linux/amd64
          push: never
          runCmd: ./scripts/build-linux.sh
          env: |
            THREESTRANDS_GOOGLE_CLIENT_ID
            THREESTRANDS_GOOGLE_CLIENT_SECRET
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            THREESTRANDS_RELEASE_BUILD
            CARGO_BUILD_JOBS
            CARGO_INCREMENTAL
            CARGO_PROFILE_DEV_DEBUG
            CARGO_PROFILE_TEST_DEBUG

      - name: Upload Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: threestrands-linux-amd64
          path: artifacts/linux-amd64/
          if-no-files-found: error
