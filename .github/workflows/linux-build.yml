name: Linux build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Require and embed the configured Google OAuth client
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-amd64:
    name: Linux x86-64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # devcontainers/ci exports an OCI archive when platform is specified.
      # The runner's default docker driver does not support this exporter.
      - name: Set up Docker Buildx for OCI export
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true

      - name: Build and verify packages in the devcontainer
        uses: devcontainers/ci@v0.3
        env:
          THREESTRANDS_GOOGLE_CLIENT_ID: ${{ inputs.release == true && secrets.THREESTRANDS_GOOGLE_CLIENT_ID || '' }}
          THREESTRANDS_GOOGLE_CLIENT_SECRET: ${{ inputs.release == true && secrets.THREESTRANDS_GOOGLE_CLIENT_SECRET || '' }}
          THREESTRANDS_RELEASE_BUILD: ${{ inputs.release == true && '1' || '0' }}
        with:
          platform: linux/amd64
          push: never
          runCmd: ./scripts/build-linux.sh
          env: |
            THREESTRANDS_GOOGLE_CLIENT_ID
            THREESTRANDS_GOOGLE_CLIENT_SECRET
            THREESTRANDS_RELEASE_BUILD

      - name: Upload Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: threestrands-linux-amd64
          path: artifacts/linux-amd64/
          if-no-files-found: error
