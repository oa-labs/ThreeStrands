name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
      - name: Test release validation and artifact collection
        run: node --test scripts/release.test.mjs scripts/changelog.test.mjs scripts/license-rtf.test.mjs
      - name: Check tag against all application versions and the changelog format
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs validate "$RELEASE_TAG"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    # Xcode 26 supports the authored Icon Composer asset. Both targets can
    # compile on Apple Silicon; Rust tests run natively on the runner.
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            binary_arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
            binary_arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run JavaScript tests
        run: pnpm test
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Run shared crate tests
        run: cargo test --locked --workspace
      - name: Build, sign, and notarize macOS installer
        env:
          BUILD_TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          THREESTRANDS_GOOGLE_CLIENT_ID: ${{ secrets.THREESTRANDS_GOOGLE_CLIENT_ID }}
          THREESTRANDS_GOOGLE_CLIENT_SECRET: ${{ secrets.THREESTRANDS_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID THREESTRANDS_GOOGLE_CLIENT_ID THREESTRANDS_GOOGLE_CLIENT_SECRET TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "error: repository secret $name is required" >&2
              exit 1
            fi
          done
          # Tauri imports the certificate into a temporary keychain and
          # notarizes/staples the app. Use our CLI shim for Icon Composer.
          # The updater config also packs and signs the app as an update.
          pnpm tauri build --target "$BUILD_TARGET" --bundles app,dmg --config src-tauri/tauri.updater.conf.json
      - name: Verify signature, notarization, and architecture
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BINARY_ARCH: ${{ matrix.binary_arch }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$BUILD_TARGET/release/bundle"
          app="$bundle/macos/ThreeStrands.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2> "$RUNNER_TEMP/codesign-details.txt"
          grep -Fq 'Authority=Developer ID Application:' "$RUNNER_TEMP/codesign-details.txt"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          actual_arch="$(lipo -archs "$app/Contents/MacOS/threestrands")"
          if [[ "$actual_arch" != "$BINARY_ARCH" ]]; then
            echo "error: expected $BINARY_ARCH executable; found $actual_arch" >&2
            exit 1
          fi
          shopt -s nullglob
          installers=("$bundle"/dmg/*.dmg)
          if [[ "${#installers[@]}" != 1 ]]; then
            echo "error: expected exactly one macOS DMG" >&2
            exit 1
          fi
          hdiutil verify "${installers[0]}"
          # The update package must carry the same signed, stapled app that
          # the DMG does; installed copies swap it in without Gatekeeper's
          # first-launch check.
          update="$bundle/macos/ThreeStrands.app.tar.gz"
          test -s "$update.sig"
          update_dir="$(mktemp -d)"
          tar -xzf "$update" -C "$update_dir"
          codesign --verify --deep --strict --verbose=2 "$update_dir/ThreeStrands.app"
          xcrun stapler validate "$update_dir/ThreeStrands.app"
          mkdir -p "artifacts/macos-$ARTIFACT_ARCH"
          cp "${installers[0]}" "$update" "$update.sig" "artifacts/macos-$ARTIFACT_ARCH/"
      - name: Upload verified installer
        uses: actions/upload-artifact@v6
        with:
          name: threestrands-release-macos-${{ matrix.arch }}
          path: |
            artifacts/macos-${{ matrix.arch }}/*.dmg
            artifacts/macos-${{ matrix.arch }}/*.app.tar.gz
            artifacts/macos-${{ matrix.arch }}/*.app.tar.gz.sig
          if-no-files-found: error

  linux:
    name: Linux x86-64 packages
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The hosted image's preinstalled SDKs leave too little disk for the
      # devcontainer image, Cargo target, and AppImage staging.
      - name: Free runner disk space
        run: ./scripts/free-ci-disk.sh

      # devcontainers/ci exports an OCI archive when platform is specified.
      # The runner's default docker driver does not support this exporter.
      - name: Set up Docker Buildx for OCI export
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true
      - name: Build and verify packages in the devcontainer
        uses: devcontainers/ci@v0.3
        env:
          THREESTRANDS_GOOGLE_CLIENT_ID: ${{ secrets.THREESTRANDS_GOOGLE_CLIENT_ID }}
          THREESTRANDS_GOOGLE_CLIENT_SECRET: ${{ secrets.THREESTRANDS_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          THREESTRANDS_RELEASE_BUILD: "1"
          # Avoid full debug symbols and incremental caches on ephemeral runners.
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        with:
          platform: linux/amd64
          push: never
          runCmd: ./scripts/build-linux.sh
          env: |
            THREESTRANDS_GOOGLE_CLIENT_ID
            THREESTRANDS_GOOGLE_CLIENT_SECRET
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            THREESTRANDS_RELEASE_BUILD
            CARGO_BUILD_JOBS
            CARGO_INCREMENTAL
            CARGO_PROFILE_DEV_DEBUG
            CARGO_PROFILE_TEST_DEBUG
      - name: Upload verified packages
        uses: actions/upload-artifact@v6
        with:
          name: threestrands-release-linux-amd64
          path: artifacts/linux-amd64/
          if-no-files-found: error

  windows:
    name: Windows x86-64 installer
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run JavaScript tests
        run: pnpm test
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Run shared crate tests
        run: cargo test --locked --workspace
      # Authenticode signing is wired for Azure Trusted Signing but stays OFF
      # until the four AZURE_SIGNING_* secrets are present. With them, this
      # step installs the signer and rewrites the signed-config fragment with
      # the account's endpoint so `tauri build` signs each bundled binary; a
      # released build with no secrets ships unsigned and SmartScreen warns.
      - name: Prepare Authenticode signing (only when configured)
        id: signing
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        run: |
          $required = 'AZURE_SIGNING_ENDPOINT', 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET'
          $present = @($required | Where-Object { [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($_)) }).Count -eq 0
          if ($present) {
            cargo install artifact-signing-cli --version '>=0.5, <0.6' --locked
            if ($LASTEXITCODE -ne 0) { Write-Error 'failed to install artifact-signing-cli'; exit 1 }
            $fragment = 'src-tauri/tauri.windows.signed.conf.json'
            (Get-Content $fragment -Raw).Replace('AZURE_SIGNING_ENDPOINT_PLACEHOLDER', $env:AZURE_SIGNING_ENDPOINT) |
              Set-Content $fragment -NoNewline
            "config=--config src-tauri/tauri.windows.signed.conf.json" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host 'Authenticode signing ENABLED via Azure Trusted Signing.'
          } else {
            "config=" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Warning 'Azure signing secrets absent; building an UNSIGNED installer (SmartScreen will warn).'
          }
      # tauri.updater.conf.json makes the NSIS bundler emit the .exe update
      # package and its minisign .sig, signed with the same updater key the
      # macOS and Linux jobs use. That updater signature is independent of
      # Authenticode: updates verify even while the installer is unsigned.
      - name: Build Windows installer
        env:
          THREESTRANDS_GOOGLE_CLIENT_ID: ${{ secrets.THREESTRANDS_GOOGLE_CLIENT_ID }}
          THREESTRANDS_GOOGLE_CLIENT_SECRET: ${{ secrets.THREESTRANDS_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in THREESTRANDS_GOOGLE_CLIENT_ID THREESTRANDS_GOOGLE_CLIENT_SECRET TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "error: repository secret $name is required" >&2
              exit 1
            fi
          done
          pnpm tauri build --target x86_64-pc-windows-msvc \
            --config src-tauri/tauri.windows.conf.json \
            --config src-tauri/tauri.updater.conf.json \
            ${{ steps.signing.outputs.config }}
      - name: Verify the installer and updater artifacts
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundle -Filter *.exe -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            Write-Error "expected exactly one NSIS installer in $bundle; found $($installers.Count)"
            exit 1
          }
          if ($installers[0].Length -eq 0) { Write-Error "NSIS installer is empty"; exit 1 }
          $sig = Get-ChildItem -Path $bundle -Filter *.exe.sig -ErrorAction SilentlyContinue
          if ($sig.Count -ne 1 -or $sig[0].Length -eq 0) {
            Write-Error "expected exactly one non-empty updater signature (.exe.sig) in $bundle"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path artifacts/windows-x86_64 | Out-Null
          Copy-Item $installers[0].FullName, $sig[0].FullName artifacts/windows-x86_64/
          Write-Host "Built $($installers[0].Name) ($([math]::Round($installers[0].Length / 1MB, 1)) MB) + updater signature"
      - name: Upload verified installer
        uses: actions/upload-artifact@v6
        with:
          name: threestrands-release-windows-x86_64
          path: artifacts/windows-x86_64/
          if-no-files-found: error

  release:
    name: Create draft GitHub Release
    needs: [validate, macos, linux, windows]
    # macOS must build. Linux and Windows are optional: when either fails, the
    # draft ships without it and the run summary says so.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can write repository contents. It has no signing secrets.
    # pages: read only resolves the site URL linked from the release notes.
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
      - name: Download this run's build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: threestrands-release-*
          path: artifacts/release-input
      - name: Collect all installers and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SKIPPED_PLATFORMS: >-
            ${{ needs.linux.result != 'success' && 'linux-amd64' || '' }}
            ${{ needs.windows.result != 'success' && 'windows-x86_64' || '' }}
        run: node scripts/release.mjs prepare-assets artifacts/release-input artifacts/release-assets "$RELEASE_VERSION"
      # Notes cover every CHANGELOG.md section since the last published
      # release. Drafts never shipped, so they do not end the range.
      - name: Write release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/published-tags"
          RELEASE_SITE_URL="$(gh api "repos/$GH_REPO/pages" --jq '.html_url' 2>/dev/null || true)" \
            node scripts/release.mjs notes "$RELEASE_TAG" "$RUNNER_TEMP/published-tags" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != true ]]; then
              echo "error: refusing to replace assets of published release $RELEASE_TAG" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --draft --prerelease="$RELEASE_PRERELEASE" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            flags=()
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ThreeStrands $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" artifacts/release-assets/* --clobber
          {
            echo "### ThreeStrands $RELEASE_TAG ($RELEASE_CHANNEL)"
            echo
            missing=()
            [[ "$LINUX_RESULT" == success ]] || missing+=("Linux ($LINUX_RESULT)")
            [[ "$WINDOWS_RESULT" == success ]] || missing+=("Windows ($WINDOWS_RESULT)")
            if (( ${#missing[@]} )); then
              echo "> [!WARNING]"
              echo "> Not in this release: ${missing[*]}. Those users are not offered this update."
              echo
              echo "The macOS installers and update packages, plus any other platform that built, are attached to a draft release."
            else
              echo "All installers, update packages, latest.json, and SHA256SUMS are attached to a draft release."
            fi
            echo "Verify installation, then publish the draft in GitHub Releases."
            echo "Publishing a stable release offers it to installed copies through latest.json."
            gh release view "$RELEASE_TAG" --json url --jq '.url'
          } >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Redeploy marketing site
    needs: [validate, release]
    # Betas stay off the marketing site; it shows the latest stable version.
    # !cancelled() keeps an optional platform's failure from skipping this job.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.validate.outputs.prerelease == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Unlike pushes, a workflow_dispatch sent with GITHUB_TOKEN starts a run.
    permissions:
      actions: write
    steps:
      - name: Rebuild the site from master with the released version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml --ref master
