name: Supply chain

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "supply-chain/**"
      - "src-tauri/supply-chain/**"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches:
      - master
  # New RustSec advisories arrive without any change in this repository.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo vet and cargo deny
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      CARGO_VET_VERSION: "0.10.3"
      CARGO_VET_SHA256: e83878b80913fbe43629c28768e14ab51f4e86a4ba8f9dd08cc25b8dbc503c19
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned release binaries, checked against their published digests, so
      # the tools' own build scripts never run on the runner.
      - name: Install cargo-vet and cargo-deny
        run: |
          tools="$RUNNER_TEMP/supply-chain-tools"
          mkdir -p "$tools"
          cd "$tools"
          vet="cargo-vet-x86_64-unknown-linux-gnu.tar.xz"
          deny="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "https://github.com/mozilla/cargo-vet/releases/download/v${CARGO_VET_VERSION}/${vet}"
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny}"
          printf '%s  %s\n%s  %s\n' "$CARGO_VET_SHA256" "$vet" "$CARGO_DENY_SHA256" "$deny" | sha256sum -c -
          tar -xJf "$vet" --strip-components=1
          tar -xzf "$deny" --strip-components=1
          echo "$tools" >> "$GITHUB_PATH"

      - name: cargo vet (root workspace)
        run: cargo vet --locked

      - name: cargo vet (src-tauri)
        working-directory: src-tauri
        run: cargo vet --locked

      - name: cargo deny (root workspace)
        if: ${{ !cancelled() }}
        run: cargo deny check advisories sources

      - name: cargo deny (src-tauri)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories sources
