<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Dispatch app icon</title>
  <desc id="desc">A fast paper message flying toward the upper right</desc>
  <defs>
    <linearGradient id="background" x1="130" y1="900" x2="890" y2="100">
      <stop offset="0" stop-color="#11142f"/>
      <stop offset=".52" stop-color="#34318a"/>
      <stop offset="1" stop-color="#7164e8"/>
    </linearGradient>
    <linearGradient id="message" x1="300" y1="740" x2="780" y2="260">
      <stop offset="0" stop-color="#d9dcff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="790" x2="470" y2="470">
      <stop offset="0" stop-color="#ff7a8a"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#090b25" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#background)"/>
