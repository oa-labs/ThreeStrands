  <path d="M175 642c58-15 108-43 151-84" fill="none" stroke="#a6a3ff" stroke-opacity=".66" stroke-width="30" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <path d="M285 343c-34-30-14-86 31-88l493-27c47-3 78 47 54 88L612 741c-24 41-85 33-98-13l-55-190-174-195Z" fill="url(#message)"/>
    <path d="m319 294 289 281 211-297-360 260" fill="none" stroke="#c3c6fa" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m459 538 357-259-261 150" fill="none" stroke="#655dde" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="809" cy="233" r="38" fill="#ffad6e"/>
